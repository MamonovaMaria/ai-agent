[tool.poetry]
name = "ai-agent"
version = "0.1.0"
description = "AI-агент на LangChain с инструментами, памятью и RAG"
authors = ["Коханчик Мария"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
langchain = "^0.3.0"
langchain-openai = "^0.3.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
numpy = "^1.26.0"
ollama = "^0.6.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
agent = "app.main:main"