[tool.poetry]
name = "ai-agent"
version = "0.1.0"
description = "AI-агент на LangChain с инструментами, памятью и RAG"
authors = ["Коханчик Мария"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
langchain = "^1.0.0"
langchain-openai = "^1.0.0"
deepagents = "^0.7.6"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
numpy = "^1.26.0"
ollama = "^0.6.2"
faiss-cpu = "^1.15.0"
langgraph-checkpoint-sqlite = "^3.1.1"
msgpack = "^1.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
agent = "app.main:main"